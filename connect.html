    /* connect-page specifics */
    .card-btn {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--s-3);
      width: 100%;
      text-align: left;
      padding: var(--s-3);
      background: var(--cream-2);
      border: 1px solid var(--rule);
      transition: padding-left 200ms var(--ease-out), border-color 200ms var(--ease-out);

    .card-btn:hover,

      outline: none;
      padding-left: calc(var(--s-3) + var(--s-1));

      font-size: 12px;
      color: var(--ink-3);
      margin-top: var(--s-3);
      min-height: 1.5em;

    .saved-note.is-done { color: var(--accent); }

    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--s-2);
      text-align: center;
    }
    .qr-frame {

      max-width: 60vw;
      padding: var(--s-2);
      background: var(--cream-2);
      border: 1px solid var(--rule);

      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--rule);
      margin-bottom: var(--s-3);

        note.textContent = 'Contact downloaded — open it to add Kevin to your phone.';
        note.classList.add('is-done');
      } catch (e) {
        note.textContent = 'Something went wrong — email ' + atob('cGVkZWF1eEBnbWFpbC5jb20=') + ' and I’ll send it.';
      }
    });
